[package]
name = "egui-pipes"
version = "0.1.4"
edition = "2021"
rust-version = "1.80"
description = "A pipe-connecting puzzle game library for egui"
license = "MIT OR Apache-2.0"
authors = ["Cecile Tonglet <cecile.tonglet@cecton.com>"]
repository = "https://github.com/cecton/egui-pipes"
homepage = "https://cecton.github.io/egui-pipes"
documentation = "https://docs.rs/egui-pipes"
keywords = ["egui", "pipes", "puzzle", "widget", "gui"]
categories = ["game-engines", "gui"]
exclude = ["/examples", "/.github"]

[lib]
name = "egui_pipes"

[dependencies]
egui = { version = "0.35", default-features = false }
fastrand = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
fastrand = { version = "2", features = ["js"] }

[dev-dependencies]
# Fonts only matter to the tests, which run a real `egui` pass over the
# widget; the library itself never needs them.
egui = { version = "0.35", features = ["default_fonts"] }
xtask-wasm = { version = "0.6.5", features = ["run-example", "wasm-opt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "MediaQueryList",
    "Window",
] }
